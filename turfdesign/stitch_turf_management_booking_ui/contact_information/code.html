<script>
        // Micro-interactions and Countdown Logic
        document.addEventListener('DOMContentLoaded', () => {
            const countdownEl = document.getElementById('countdown');
            const countdownBar = document.getElementById('countdown-bar');
            let totalSeconds = (4 * 60) + 32;
            const initialSeconds = totalSeconds;

            const timer = setInterval(() => {
                totalSeconds--;
                if (totalSeconds <= 0) {
                    clearInterval(timer);
                    countdownEl.textContent = "00:00";
                    return;
                }

                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                countdownEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                const percentage = (totalSeconds / initialSeconds) * 100;
                countdownBar.style.width = `${percentage}%`;
                
                if (totalSeconds < 60) {
                    countdownBar.classList.remove('bg-on-secondary-container');
                    countdownBar.classList.add('bg-error');
                }
            }, 1000);

            // Button interaction
            const btn = document.getElementById('btn-continue');
            btn.addEventListener('click', function() {
                this.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...`;
                setTimeout(() => {
                    this.innerHTML = `Continue <span class="material-symbols-outlined">arrow_forward</span>`;
                }, 2000);
            });

            // Form focus effects
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.color = '#006b30';
                });
                input.addEventListener('blur', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.color = '#6f7a6e';
                });
            });
        });
    </script>
